<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Bike Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0d0d0d; color: white; padding: 40px 20px; }
        
        .checkout-container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1.5fr 1fr; gap: 40px; }
        
        h1 { font-size: 2.5rem; margin-bottom: 30px; grid-column: 1 / -1; border-left: 5px solid #ff6600; padding-left: 15px; }

        /* ================= FORM STYLES ================= */
        .checkout-section { background: #1a1a1a; padding: 30px; border-radius: 20px; margin-bottom: 25px; border: 1px solid #333; }
        .checkout-section h2 { font-size: 1.3rem; margin-bottom: 20px; color: #ff6600; display: flex; align-items: center; gap: 10px; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #888; font-size: 0.9rem; }
        .form-group input, .form-group select { width: 100%; background: #0d0d0d; border: 1px solid #333; padding: 12px 15px; border-radius: 10px; color: white; font-size: 1rem; outline: none; transition: 0.3s; }
        .form-group input:focus { border-color: #ff6600; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        /* ================= SUMMARY STYLES ================= */
        .order-summary { background: #1a1a1a; padding: 30px; border-radius: 20px; border: 1px solid #333; height: fit-content; position: sticky; top: 20px; }
        .summary-item { display: flex; justify-content: space-between; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #222; }
        .summary-item:last-of-type { border-bottom: none; }
        
        .total-row { display: flex; justify-content: space-between; font-size: 1.5rem; font-weight: bold; margin-top: 20px; padding-top: 20px; border-top: 2px solid #ff6600; }

        .place-order-btn { width: 100%; background: #ff6600; color: white; border: none; padding: 18px; border-radius: 40px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.4s; margin-top: 30px; }
        .place-order-btn:hover { background: #e65c00; transform: translateY(-5px); box-shadow: 0 10px 20px rgba(255,102,0,0.3); }

        /* ================= SUCCESS MESSAGE ================= */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .success-card { background: #1a1a1a; padding: 50px; border-radius: 30px; text-align: center; border: 2px solid #ff6600; transform: scale(0.7); transition: 0.5s; }
        .success-card i { font-size: 5rem; color: #ff6600; margin-bottom: 20px; }

        @media (max-width: 900px) { .checkout-container { grid-template-columns: 1fr; } .order-summary { position: static; } }
    </style>
</head>
<body>

    <div class="checkout-container">
        <h1>Checkout Process</h1>

        <div class="left-side">
            <form id="checkoutForm">
                <div class="checkout-section">
                    <h2><i class="fas fa-user"></i> Personal Information</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" placeholder="e.g. Shahid" required>
                        </div>
                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="tel" placeholder="+970 5xx xxx xxx" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" placeholder="example@mail.com" required>
                    </div>
                </div>

                <div class="checkout-section">
                    <h2><i class="fas fa-truck"></i> Shipping Details</h2>
                    <div class="form-group">
                        <label>Street Address</label>
                        <input type="text" placeholder="House number and street name" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>City</label>
                            <input type="text" required>
                        </div>
                        <div class="form-group">
                            <label>ZIP Code</label>
                            <input type="text" required>
                        </div>
                    </div>
                </div>

                <div class="checkout-section">
                    <h2><i class="fas fa-credit-card"></i> Payment Method</h2>
                    <div class="form-group">
                        <select required>
                            <option value="cod">Cash on Delivery</option>
                            <option value="card">Credit Card (Visa / Mastercard)</option>
                            <option value="paypal">PayPal</option>
                        </select>
                    </div>
                </div>
            </form>
        </div>

        <div class="right-side">
            <div class="order-summary">
                <h2>Order Summary</h2>
                <div id="itemsList" style="margin-top: 20px;">
                    </div>
                
                <div class="summary-item" style="margin-top: 20px;">
                    <span>Shipping</span>
                    <span>Free</span>
                </div>
                
                <div class="total-row">
                    <span>Total</span>
                    <span id="finalTotal">$0</span>
                </div>

                <button type="submit" form="checkoutForm" class="place-order-btn">Confirm Order</button>
            </div>
        </div>
    </div>

    <div class="overlay" id="overlay">
        <div class="success-card" id="successCard">
            <i class="fas fa-check-circle"></i>
            <h2>Order Placed Successfully!</h2>
            <p style="color: #888; margin: 15px 0 25px;">Thank you for shopping with us. Your bike is being prepared.</p>
            <a href="shop.html" style="background:#ff6600; color:white; padding:12px 30px; border-radius:30px; text-decoration:none; font-weight:bold;">Back to Shop</a>
        </div>
    </div>

    <script>
        function renderSummary() {
            const itemsList = document.getElementById("itemsList");
            const finalTotal = document.getElementById("finalTotal");
            const cart = JSON.parse(localStorage.getItem("cart")) || [];
            let total = 0;

            itemsList.innerHTML = "";
            cart.forEach(item => {
                const priceValue = parseFloat(item.price.replace(/[^0-9.]/g, ''));
                total += priceValue;
                itemsList.innerHTML += `
                    <div class="summary-item">
                        <span>${item.title}</span>
                        <span>${item.price}</span>
                    </div>
                `;
            });
            finalTotal.innerText = `$${total.toFixed(2)}`;
        }

        document.getElementById("checkoutForm").addEventListener("submit", (e) => {
            e.preventDefault();
            
            // Show Success UI
            const overlay = document.getElementById("overlay");
            const card = document.getElementById("successCard");
            overlay.style.display = "flex";
            setTimeout(() => { card.style.transform = "scale(1)"; }, 100);

            // Clear Cart
            localStorage.removeItem("cart");
        });

        window.onload = renderSummary;
    </script>
</body>
</html>
